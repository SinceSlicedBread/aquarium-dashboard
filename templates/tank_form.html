{% extends 'base.html' %}

{% block content %}

<h2>Add Aquarium</h2>

<form method="POST">
    <label>Name</label>
    <input class="form-control"
           name="name"
           required>
    <br>
    <label>Description</label>
    <textarea class="form-control"
              name="description"></textarea>
    <br>
    <button class="btn btn-success"
            type="submit">
        Save Aquarium
    </button>
</form>

{% endblock %}
