{% extends 'base.html' %}

{% block content %}

<h2>{{ tank.name }}</h2>

<p> {{ tank.description }}</p>

<a href="{{ url_for('delete_tank', id=tank.id) }}"
   class="btn btn-warning">
    Delete Tank
</a>
<hr>
<h4>Add Fish</h4>

<form method="POST"
      action="{{ url_for('add_species_to_tank', tank_id=tank.id) }}">

    <select class="form-select" name="species_id">
        {% for fish in all_species %}
            <option value="{{ fish.id }}">
                    {{ fish.common_name }}
            </option>
        {% endfor %}
    </select>
    <br>
    <button class="btn btn-primary">
        Add Fish
    </button>
</form>
<hr>
<h4>Current Species</h4>
<table class="table">



<tbody>

{% for fish in tank.species %}

<tr>

    <td>{{ fish.common_name }}</td>

    <td>

        <form
            method="POST"
            action="{{ url_for(
                'remove_species_from_tank',
                tank_id=tank.id,
                species_id=fish.id
            ) }}"
            style="display:inline;">

            <button
                type="submit"
                class="btn btn-danger btn-sm">

                Remove

            </button>

        </form>

    </td>

</tr>

{% endfor %}

</tbody>

</table>

<a href="{{ url_for('tank_dashboard',id=tank.id) }}"
   class="btn btn-success">
    Analyse Compatibility
</a>
{% endblock %}
